<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>배달 수익 챌린지</title><style>*{box-sizing:border-box}body{margin:0;background:#12151c;color:white;font-family:system-ui,'Noto Sans KR',sans-serif}.wrap{max-width:600px;margin:auto;padding:22px}.title{font-size:20px;font-weight:900}.amount{font-size:42px;font-weight:900;margin:12px 0}.track{height:35px;background:#555b65;border-radius:30px;overflow:hidden}.fill{height:100%;width:0;border-radius:30px;background:linear-gradient(90deg,#ffe44f,#ff9a1e,#ed3333);transition:width .5s}.track{position:relative}.break{position:absolute;left:90.909%;top:0;height:100%;width:13px;transform:translateX(-50%);z-index:2;display:flex;align-items:center;justify-content:center;color:white;font-size:23px;font-weight:900;text-shadow:0 1px 3px #12151c;pointer-events:none}.goal{white-space:nowrap}.check{color:#42df7b}.login{background:#fff;color:#222}.auth{margin-top:10px;font-size:13px;color:#cbd4e2}.broadcast .break{font-size:19px}.sub{display:flex;justify-content:space-between;margin-top:9px;color:#d3d8e1;font-weight:700}.status{margin:15px 0;font-size:22px;font-weight:900;color:#ffd956}.panel{margin-top:30px;padding:20px;border:1px solid #3d4552;border-radius:16px;background:#1b202b}.panel h2{font-size:18px;margin:0 0 12px}input{width:100%;padding:15px;font-size:22px;border-radius:10px;border:0}button{border:0;border-radius:10px;padding:13px 17px;font-size:17px;font-weight:800;cursor:pointer}.buttons{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}.add{background:#ffb82e}.minus{background:#a9b7d0}.reset{background:#e66c6c}.small{font-size:13px;color:#abb4c4;margin-top:12px}.broadcast{background:transparent}.broadcast .wrap{max-width:none;padding:8px 12px}.broadcast .title{font-size:17px;text-shadow:0 2px 4px #000}.broadcast .amount{font-size:30px;margin:4px 0;text-shadow:0 2px 4px #000}.broadcast .track{height:27px;background:#555b65b8}.broadcast .sub{font-size:13px;text-shadow:0 2px 4px #000}.broadcast .status{font-size:17px;margin:5px 0;text-shadow:0 2px 4px #000}.broadcast .panel{display:none}</style></head><body><div class="wrap"><div class="title">🏍️ 퇴근 후 10만원 챌린지</div><div class="amount" id="amount">0원</div><div class="track"><div class="fill" id="fill"></div><div class="break">〰</div></div><div class="sub"><span>0원</span><span class="goal" id="goal">🎯 100,000원</span><span>🏁 110,000원</span></div><div class="status" id="status">오늘도 달려보자! 🔥</div><div class="panel"><h2>💰 콜 수락 금액 추가</h2><input id="entry" type="number" min="1" inputmode="numeric" placeholder="예: 3500"><div class="buttons"><button class="login" id="login">Google 로그인</button><button class="add" id="add">+ 금액 추가</button><button class="minus" id="undo">↶ 마지막 취소</button><button class="reset" id="reset">오늘 초기화</button></div><div class="auth" id="auth">Firebase 연결 중...</div><p class="small">방송 화면: 이 주소 뒤에 <b>?view=live</b> 추가 · 조작 화면: 기본 주소<br>본폰에서 Google 로그인 후 금액을 입력하면 방송폰에 실시간 반영됩니다. 방송 화면은 로그인할 필요가 없습니다.</p></div></div><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getDatabase,ref,onValue,runTransaction} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
const firebaseConfig={apiKey:'AIzaSyBYli6uH0h7QGWdO0B3jXGGycSnh2JkL_U',authDomain:'delivery-live-9aa51.firebaseapp.com',databaseURL:'https://delivery-live-9aa51-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'delivery-live-9aa51',storageBucket:'delivery-live-9aa51.firebasestorage.app',messagingSenderId:'1089852186613',appId:'1:1089852186613:web:1c93216b16060c29d90abc'};
const broadcast=new URLSearchParams(location.search).get('view')==='live';
if(broadcast)document.body.classList.add('broadcast');
const fmt=n=>Math.round(n).toLocaleString('ko-KR')+'원';
const app=initializeApp(firebaseConfig),db=getDatabase(app),auth=getAuth(app),moneyRef=ref(db,'earnings');
const allowed='woans615@gmail.com';
let total=0,history=[];const add=document.getElementById('add'),undo=document.getElementById('undo'),reset=document.getElementById('reset'),login=document.getElementById('login'),authInfo=document.getElementById('auth');
function render(){document.getElementById('amount').textContent=fmt(total);const fill=document.getElementById('fill');fill.style.width=Math.min(100,total/110000*100)+'%';fill.style.background=total>=110000?'#29ce65':'linear-gradient(90deg,#ffe44f,#ff9a1e,#ed3333)';document.getElementById('goal').innerHTML=total>=100000?'🎯 100,000원 <span class="check">✔</span>':'🎯 100,000원';document.getElementById('status').textContent=total>=110000?'🏁 11만원 완주! 기름값·부대비용까지 확보! 🟢':total>=100000?'🎉 10만원 달성! 기름값·부대비용 더 벌자!':`목표까지 ${fmt(100000-total)} 남았다!`}
function authorized(){return auth.currentUser?.email===allowed}
function setButtons(){const ok=authorized();add.disabled=undo.disabled=reset.disabled=!ok;login.textContent=ok?'로그아웃':'Google 로그인';authInfo.textContent=ok?'✅ 로그인 완료 · 실시간 저장 가능':auth.currentUser?'⚠️ 허용된 구글 계정이 아니야':'Google 로그인 후 금액을 입력할 수 있어.'}
onAuthStateChanged(auth,setButtons);getRedirectResult(auth).catch(e=>{authInfo.textContent='로그인 오류: '+e.message});
login.onclick=async()=>{if(authorized()){await signOut(auth);return}const provider=new GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});try{await signInWithPopup(auth,provider)}catch(e){if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(e.code)){await signInWithRedirect(auth,provider)}else authInfo.textContent='로그인 실패: '+e.message}};
onValue(moneyRef,snap=>{const value=snap.val();total=typeof value==='number'&&Number.isFinite(value)?Math.max(0,value):0;render()},err=>{authInfo.textContent='DB 읽기 오류: '+err.message});
async function change(delta){if(!authorized())return alert('먼저 허용된 구글 계정으로 로그인해줘!');try{const result=await runTransaction(moneyRef,current=>Math.max(0,(typeof current==='number'?current:0)+delta));if(!result.committed)throw new Error('저장 실패');return true}catch(e){alert('Firebase 저장 오류: '+e.message);return false}}
add.onclick=async()=>{const entry=document.getElementById('entry'),v=Math.round(Number(entry.value));if(!Number.isSafeInteger(v)||v<=0)return alert('추가할 금액을 입력해줘!');add.disabled=true;const ok=await change(v);if(ok){history.push(v);entry.value=''}setButtons()};
document.getElementById('entry').addEventListener('keydown',e=>{if(e.key==='Enter')add.click()});
undo.onclick=async()=>{if(!history.length)return alert('이 폰에서 추가한 취소 기록이 없어!');undo.disabled=true;const v=history[history.length-1];if(await change(-v))history.pop();setButtons()};
reset.onclick=async()=>{if(!authorized())return alert('먼저 로그인해줘!');if(!confirm('모든 기기의 오늘 금액을 0원으로 초기화할까?'))return;try{await runTransaction(moneyRef,()=>0);history=[]}catch(e){alert('초기화 실패: '+e.message)}};
render();setButtons();
</script></body></html>
