<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0d1018;color:#f7f8ff;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif}

<body>
<div class="wrap">
<section class="card">
<div class="heading"><span class="bike-icon" id="titleEmoji">🏍</span><span id="titleText">퇴근 후 10만원 챌린지</span></div>
<div class="top"><div class="amount" id="amount">0원</div><div class="status" id="status"><span class="line">목표까지 <span class="yellow">100,000원</span></span><span class="line">남았다!</span></div></div>
<!-- 지그재그 두 조각: 같은 윤곽을 4px 평행 이동시켜 아주 얇은 균일한 틈을 둠 -->
<svg class="graph" viewBox="0 0 600 28" xmlns="http://www.w3.org/2000/svg" aria-label="배달 수익 진행바">
<defs>
<linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#ffe66a"/><stop offset="55%" stop-color="#ffae3e"/><stop offset="100%" stop-color="#ff3552"/></linearGradient>
<linearGradient id="extraGradient" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#ffae3e"/><stop offset="100%" stop-color="#ff3552"/></linearGradient>

<rect id="mainFill" x="1" y="1" width="0" height="26" fill="url(#progressGradient)" clip-path="url(#mainClip)"/>
<path d="M534 1 H586 A13 13 0 0 1 599 14 A13 13 0 0 1 586 27 H534 L528 19 L534 13 L528 7 Z" fill="#394459" stroke="#8390a8" stroke-width="1.1"/>
<rect id="extraFill" x="528" y="1" width="0" height="26" fill="url(#extraGradient)" clip-path="url(#extraClip)"/>
</svg>
<div class="live-goals"><span class="ten" id="topTen">🎯 10만원</span><span class="eleven" id="topEleven">11만원 🏁</span></div>

</section>

</section>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getDatabase,ref,onValue,runTransaction} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
const firebaseConfig={apiKey:'AIzaSyBYli6uH0h7QGWdO0B3jXGGycSnh2JkL_U',authDomain:'delivery-live-9aa51.firebaseapp.com',databaseURL:'https://delivery-live-9aa51-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'delivery-live-9aa51',storageBucket:'delivery-live-9aa51.firebasestorage.app',messagingSenderId:'1089852186613',appId:'1:1089852186613:web:1c93216b16060c29d90abc'};
const live=document.documentElement.classList.contains('live');
const app=initializeApp(firebaseConfig),db=getDatabase(app),auth=getAuth(app);
const moneyRef=ref(db,'earnings'),settingsRef=ref(db,'broadcastSettings'),allowed='woans615@gmail.com';
const $=id=>document.getElementById(id);
const fmt=n=>Math.round(n).toLocaleString('ko-KR')+'원';
let total=0,history=[],busy=false,settingsBusy=false;
const defaults={emoji:'🏍',title:'퇴근 후 10만원 챌린지',goal:100000,final:110000};
let settings={...defaults},settingsLoaded=false;
const compact=n=>{if(n%10000===0)return (n/10000)+'만원';return Math.round(n).toLocaleString('ko-KR')+'원'};
function renderSettings(){
 $('titleEmoji').textContent=settings.emoji;
 $('titleText').textContent=settings.title;
 if(!live){
  $('settingEmoji').value=settings.emoji;$('settingTitle').value=settings.title;
  $('settingGoal').value=settings.goal;$('settingFinal').value=settings.final;
 }
 render();
}

function render(){
 $('amount').textContent=fmt(total);
 $('mainFill').setAttribute('width',Math.min(1,total/settings.goal)*529);
 $('extraFill').setAttribute('width',Math.max(0,Math.min(1,(total-settings.goal)/(settings.final-settings.goal)))*71);
 if(total>=settings.final){
  $('mainFill').setAttribute('fill','#4ce675');$('extraFill').setAttribute('fill','#4ce675');
  $('status').innerHTML='<span class="line green">🏁 11만원 완주!</span><span class="line">부대비용까지 확보!</span>';
  $('goal').textContent='✅ '+compact(settings.goal)+' ~ ✅ '+compact(settings.final);
 }else if(total>=settings.goal){
  $('mainFill').setAttribute('fill','#ff4856');$('extraFill').setAttribute('fill','url(#extraGradient)');
  $('status').innerHTML='<span class="line red">🎉 10만원 달성!</span><span class="line">기름값 '+fmt(settings.final-total)+' 남음</span>';
  $('goal').textContent='✅ '+compact(settings.goal)+' ~ '+compact(settings.final)+' 🏁';
 }else{
  $('mainFill').setAttribute('fill','url(#progressGradient)');$('extraFill').setAttribute('fill','url(#extraGradient)');
  $('status').innerHTML='<span class="line">목표까지 <span class="yellow">'+fmt(settings.goal-total)+'</span></span><span class="line">남았다!</span>';
  $('goal').textContent='🎯 '+compact(settings.goal)+' ~ '+compact(settings.final)+' 🏁';
 }
 if(live){
   /* 제목과 오토바이 아이콘은 HTML 그대로 유지 */
   if(total>=settings.final){$('status').innerHTML='<span class="line green">🏁 11만원 완주!</span>'}
   else if(total>=settings.goal){$('status').innerHTML='<span class="line red">🎉 10만원 달성!</span>'}
   else {$('status').innerHTML='<span class="line">목표 <span class="yellow">'+fmt(settings.goal-total)+'</span></span>'}
   $('tenMark').textContent=total>=settings.goal?'✅ '+compact(settings.goal):'🎯 '+compact(settings.goal);
   $('elevenMark').textContent=total>=settings.final?'✅ '+compact(settings.final):compact(settings.final)+' 🏁';
   $('topTen').textContent=total>=settings.goal?'✅ '+compact(settings.goal):'🎯 '+compact(settings.goal);
   $('topEleven').textContent=total>=settings.final?'✅ '+compact(settings.final):compact(settings.final)+' 🏁';
 }
}
function authorized(){return auth.currentUser?.email===allowed}
function setButtons(){const ok=authorized()&&!busy;$('add').disabled=!ok;$('undo').disabled=!ok;$('reset').disabled=!ok;$('login').textContent=authorized()?'로그아웃':'Google 로그인';$('auth').textContent=authorized()?'✅ 로그인 완료 · 실시간 저장 가능':auth.currentUser?'⚠️ 허용된 구글 계정이 아니야':'Google 로그인 후 금액을 입력할 수 있어.'}
onValue(settingsRef,snap=>{
 const v=snap.val();
 if(v&&typeof v==='object'&&Number.isSafeInteger(v.goal)&&v.goal>0&&Number.isSafeInteger(v.final)&&v.final>v.goal&&typeof v.title==='string'&&typeof v.emoji==='string'){
  settings={emoji:v.emoji.slice(0,12),title:v.title.slice(0,32),goal:v.goal,final:v.final};
 }else settings={...defaults};
 settingsLoaded=true;renderSettings();
},err=>{if(!live)$('settingsInfo').textContent='설정 읽기 오류: '+err.message+' (Firebase 규칙 확인 필요)'});
onValue(moneyRef,snap=>{const value=snap.val();total=typeof value==='number'&&Number.isFinite(value)?Math.max(0,value):0;render()},err=>{if(!live)$('auth').textContent='DB 읽기 오류: '+err.message});
if(!live){
 onAuthStateChanged(auth,()=>{setButtons();$('saveSettings').disabled=!authorized()});
 getRedirectResult(auth).catch(e=>{$('auth').textContent='로그인 오류: '+e.message});
 $('login').onclick=async()=>{if(authorized()){await signOut(auth);return}const provider=new GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});try{await signInWithPopup(auth,provider)}catch(e){if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(e.code)){await signInWithRedirect(auth,provider)}else{$('auth').textContent='로그인 실패: '+e.message}}};
 async function change(delta,reset=false){if(!authorized()){alert('허용된 구글 계정으로 로그인해줘!');return false}if(busy)return false;busy=true;setButtons();try{const result=await runTransaction(moneyRef,current=>{const value=typeof current==='number'?current:0;return reset?0:Math.max(0,value+delta)});if(!result.committed)throw new Error('저장 실패');return true}catch(e){alert('Firebase 저장 오류: '+e.message);return false}finally{busy=false;setButtons()}}
 $('add').onclick=async()=>{const v=Number($('entry').value);if(!Number.isSafeInteger(v)||v<=0){alert('추가할 금액을 입력해줘!');return}if(await change(v)){history.push(v);$('entry').value=''}};
 $('entry').addEventListener('keydown',e=>{if(e.key==='Enter')$('add').click()});
 $('undo').onclick=async()=>{if(!history.length){alert('이 폰에서 추가한 취소 기록이 없어!');return}const v=history[history.length-1];if(await change(-v))history.pop()};
 $('reset').onclick=async()=>{if(!confirm('오늘 금액을 0원으로 초기화할까?'))return;if(await change(0,true))history=[]};
 setButtons();
}
render();
</script>
</body>
</html>
