<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>배달 수익 챌린지</title><style>*{box-sizing:border-box}body{margin:0;background:#12151c;color:white;font-family:system-ui,'Noto Sans KR',sans-serif}.wrap{max-width:600px;margin:auto;padding:22px}.title{font-size:20px;font-weight:900}.amount{font-size:42px;font-weight:900;margin:12px 0}.track{height:35px;background:#555b65;border-radius:30px;overflow:hidden}.fill{height:100%;width:0;border-radius:30px;background:linear-gradient(90deg,#ffe44f,#ff9a1e,#ed3333);transition:width .5s}.sub{display:flex;justify-content:space-between;margin-top:9px;color:#d3d8e1;font-weight:700}.status{margin:15px 0;font-size:22px;font-weight:900;color:#ffd956}.panel{margin-top:30px;padding:20px;border:1px solid #3d4552;border-radius:16px;background:#1b202b}.panel h2{font-size:18px;margin:0 0 12px}input{width:100%;padding:15px;font-size:22px;border-radius:10px;border:0}button{border:0;border-radius:10px;padding:13px 17px;font-size:17px;font-weight:800;cursor:pointer}.buttons{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}.add{background:#ffb82e}.minus{background:#a9b7d0}.reset{background:#e66c6c}.small{font-size:13px;color:#abb4c4;margin-top:12px}.broadcast{background:transparent}.broadcast .wrap{max-width:none;padding:8px 12px}.broadcast .title{font-size:17px;text-shadow:0 2px 4px #000}.broadcast .amount{font-size:30px;margin:4px 0;text-shadow:0 2px 4px #000}.broadcast .track{height:27px;background:#555b65b8}.broadcast .sub{font-size:13px;text-shadow:0 2px 4px #000}.broadcast .status{font-size:17px;margin:5px 0;text-shadow:0 2px 4px #000}.broadcast .panel{display:none}</style></head><body><div class="wrap"><div class="title">🏍️ 퇴근 후 10만원 챌린지</div><div class="amount" id="amount">0원</div><div class="track"><div class="fill" id="fill"></div></div><div class="sub"><span>0원</span><span>🎯 100,000원</span><span>🏁 110,000원</span></div><div class="status" id="status">오늘도 달려보자! 🔥</div><div class="panel"><h2>💰 콜 수락 금액 추가</h2><input id="entry" type="number" min="1" inputmode="numeric" placeholder="예: 3500"><div class="buttons"><button class="add" id="add">+ 금액 추가</button><button class="minus" id="undo">↶ 마지막 취소</button><button class="reset" id="reset">오늘 초기화</button></div><p class="small">방송 화면: 이 주소 뒤에 <b>?view=live</b> 추가 · 조작 화면: 기본 주소<br>금액은 이 브라우저에만 저장됩니다. 다른 폰의 방송 화면과 실시간 동기화하려면 Firebase 연결이 추가로 필요합니다.</p></div></div><script>const broadcast=new URLSearchParams(location.search).get('view')==='live';if(broadcast)document.body.classList.add('broadcast');const KEY='delivery-live-total-v1',HKEY='delivery-live-history-v1';let total=Number(localStorage.getItem(KEY)||0),history=JSON.parse(localStorage.getItem(HKEY)||'[]');const fmt=n=>Math.round(n).toLocaleString('ko-KR')+'원';function render(){document.getElementById('amount').textContent=fmt(total);let p=Math.min(100,total/110000*100);let f=document.getElementById('fill');f.style.width=p+'%';f.style.background=total>=110000?'linear-gradient(90deg,#ffe44f,#ff9a1e,#ed3333,#29ce65)':'linear-gradient(90deg,#ffe44f,#ff9a1e,#ed3333)';document.getElementById('status').textContent=total>=110000?'🏁 11만원까지 완주! 🟢':total>=100000?'🎉 10만원 달성! 기름값 벌러 더 가자!':`목표까지 ${fmt(100000-total)} 남았다!`;localStorage.setItem(KEY,total);localStorage.setItem(HKEY,JSON.stringify(history))}document.getElementById('add').onclick=()=>{let v=Math.round(Number(document.getElementById('entry').value));if(!Number.isFinite(v)||v<=0)return alert('추가할 금액을 입력해줘!');history.push(v);total+=v;document.getElementById('entry').value='';render()};document.getElementById('entry').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('add').click()});document.getElementById('undo').onclick=()=>{if(!history.length)return alert('취소할 기록이 없어!');total=Math.max(0,total-history.pop());render()};document.getElementById('reset').onclick=()=>{if(confirm('오늘 금액을 0원으로 초기화할까?')){total=0;history=[];render()}};render();</script></body></html>
